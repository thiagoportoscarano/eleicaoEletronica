<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleição Eletrônica API — Documentação</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <!-- Documentação estática gerada de docs/openapi.json (python -m scripts.exportar_openapi).
       Publicada pelo GitHub Pages (pasta /docs da main). Com a API rodando em localhost:8000,
       o botão "Try it out" funciona direto daqui. -->
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({ url: "openapi.json", dom_id: "#swagger-ui", persistAuthorization: true });
  </script>
</body>
</html>
